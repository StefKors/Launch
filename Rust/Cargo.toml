[package]
name = "launch-fsearch-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "launch_fsearch_ffi"
crate-type = ["staticlib"]

[dependencies]
# Pinned by the submodule's commit, not by a crates.io version.
fsearch = { path = "../Vendor/fsearch" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Settings of dependencies' own [profile] tables are ignored, so mirror
# upstream's release profile here.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
